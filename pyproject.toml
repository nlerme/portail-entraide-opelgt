[project]
name = "portail-entraide-opel-gt"
version = "1.1.22"
description = "Portail Linux unifié pour les bulletins, les pièces, les petites annonces, les couples de serrage et les fiches Opel GT"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Nicolas Lermé"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: tests nécessitant un accès Internet explicite"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["scrapers"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
