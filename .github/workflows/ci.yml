name: Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng shellcheck
      - name: Dépendances Python
        run: python -m pip install -r requirements-dev.lock
      - name: Tests
        run: python -W error -m pytest -q
      - name: Ruff
        run: ruff check .
      - name: Bash
        run: bash -n run_server.sh && shellcheck run_server.sh
      - name: JavaScript
        run: find static -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verrous de dépendances
        run: sha256sum -c requirements.lock.sha256
      - name: Absence de secrets et de données d’exécution
        run: |
          test ! -e config.json
          test ! -e secrets.json
          test ! -e .env
          ! find . -type f \( -name '*.db' -o -name '*.db-shm' -o -name '*.db-wal' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.log' \) -print | grep .
