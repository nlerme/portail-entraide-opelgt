[Unit]
Wants=network-online.target
After=network-online.target portail-entraide-opel-gt-web.service
StartLimitIntervalSec=0

[Service]
# HTTP/2 avoids idle UDP/QUIC sessions being discarded by some routers.
Environment=TUNNEL_TRANSPORT_PROTOCOL=http2
Environment=TUNNEL_METRICS=127.0.0.1:20241
Restart=always
RestartSec=10s
TimeoutStartSec=90s
TimeoutStopSec=30s
