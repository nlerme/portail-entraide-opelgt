<!doctype html>
<html lang="fr" data-theme="light" data-font="normal">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="referrer" content="no-referrer">
  <title>Page de connexion membre - Portail Entraide Opel GT</title>
  <link rel="icon" href="/static/common/logo.png" type="image/png"><link rel="stylesheet" href="/static/common/base.css?v=1.1.36">
  <link rel="stylesheet" href="/static/common/responsive.css?v=1.1.36">
  <link rel="stylesheet" href="/static/common/footer.css?v=1.1.36">
</head>
<body class="page-login">
<main class="page-main">
  <form id="loginForm" class="card" novalidate>
    <div class="brand"><img src="/static/common/logo.png" alt="Entraide Opel GT"></div>
    <div class="login-controls login-controls-inline" aria-label="État Internet et réglages d’affichage">
      <span class="connectivity-badge checking" data-connectivity-status role="status" aria-live="polite"><span aria-hidden="true">●</span> Vérification Internet…</span>
      <button type="button" class="icon-button" data-ui-theme><span data-theme-icon aria-hidden="true">☾</span>&nbsp;<span data-theme-label>Mode sombre</span></button>
      <button type="button" class="icon-button compact-control" data-ui-font-decrease aria-label="Diminuer la taille du texte">A−</button>
      <button type="button" class="icon-button compact-control" data-ui-font-increase aria-label="Augmenter la taille du texte">A+</button>
    </div>
    <h1>Page de connexion membre</h1>
    <p>Utilisez votre compte entraideopelgt.fr. Les identifiants sont vérifiés directement auprès du site membre, ne sont jamais enregistrés et ne figurent pas dans les journaux.</p>
    <label for="login">Identifiant</label><input id="login" name="login" type="text" autocomplete="username" maxlength="200" required autofocus>
    <label for="password">Mot de passe</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="500" required>
    <div id="message" class="alert hidden" role="alert"></div>
    <button id="submit" type="submit" class="primary">Se connecter</button>
    <footer class="release-footer" aria-label="Version et code source">
      <hr class="footer-separator">
      <div class="footer-release">
        <span data-bundle-version>Version 1.1.36</span>
        <a class="github-link" href="https://github.com/nlerme/portail-entraide-opelgt" target="_blank" rel="noopener noreferrer"><img src="/static/common/github.svg" alt="" aria-hidden="true" width="18" height="18">Code source sur GitHub</a>
      </div>
    </footer>
  </form>
</main>
<script src="/static/common/portal_ui.js?v=1.1.36"></script>
<script src="/static/common/login.js?v=1.1.36"></script>
</body></html>
